<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa" />
      <stop offset="35%" stop-color="#f5d77f" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997520" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#997520" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base with Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0d0d10" />
  <!-- Inner Subtle Radial Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glowGrad)" />
  <!-- Golden Chamfered Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Fountain Pen Nib & Stationery Crest Motif -->
  <g transform="translate(32, 31) scale(0.95)">
    <!-- Nib Body Base -->
    <path d="M0 -22 L11 -7 C11 5, 8 13, 0 16 C-8 13, -11 5, -11 -7 Z" fill="url(#goldGrad)" />
    <!-- Nib Center Breathing Hole and Slit -->
    <circle cx="0" cy="-6" r="2" fill="#0d0d10" />
    <path d="M0 -6 L0 -22" stroke="#0d0d10" stroke-width="1.2" stroke-linecap="round" />
    <!-- Wings Shadow Accent -->
    <path d="M-8 -6 C-7 2, -4 9, 0 11 C4 9, 7 2, 8 -6" fill="none" stroke="#7a5a14" stroke-width="1.2" opacity="0.6" />
    
    <!-- Monogram 'RS' Below Nib -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="10.5" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">RS</text>
  </g>
</svg>
