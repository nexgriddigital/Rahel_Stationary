    <script>
      // 1. Ensure trailing slash on GitHub Pages repository root paths so relative ./assets load properly
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
      // 2. Decode SPA redirected path from 404.html if present
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (redirectPath) {
          params.delete('p');
          var newSearch = params.toString() ? '?' + params.toString() : '';
          var newHash = window.location.hash;
          window.history.replaceState(null, null, window.location.pathname.replace(/\/$/, '') + redirectPath + newSearch + newHash);
        }
      })();
    </script>
    <style>
      @keyframes pulseGlow {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.35));
        }
        50% {
          transform: scale(1.05);
          filter: drop-shadow(0 0 24px rgba(245, 215, 127, 0.65));
        }
      }
      @keyframes shimmerBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .logo-loading-pulse {
        animation: pulseGlow 2.4s ease-in-out infinite;
      }
      .shimmer-track {
        position: relative;
        overflow: hidden;
      }
      .shimmer-track::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(245, 215, 127, 0.8), transparent);
        animation: shimmerBar 1.6s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#09090b] text-[#f4efe8] font-sans antialiased selection:bg-[#d4af37]/30 selection:text-[#f5d77f]">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;color:#f5d77f;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;text-align:center;">
        <div style="position:relative;margin-bottom:20px;">
          <img src="./favicon.svg" alt="Rahel Stationary Logo" class="logo-loading-pulse" style="width:72px;height:72px;display:block;" />
        </div>
        <div style="font-size:18px;font-weight:800;letter-spacing:0.04em;color:#f5d77f;margin-bottom:6px;">RAHEL STATIONARY POS</div>
        <div style="font-size:12px;color:#a89f91;margin-bottom:20px;letter-spacing:0.02em;">Loading workstation environment...</div>
        <div class="shimmer-track" style="width:180px;height:3px;background:rgba(212,175,55,0.18);border-radius:9999px;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
