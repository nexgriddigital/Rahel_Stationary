    <script>
      // 1. Ensure trailing slash on GitHub Pages repository root paths so relative ./assets load properly
      (function() {
        var path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
      // 2. Decode SPA redirected path from 404.html if present
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (redirectPath) {
          params.delete('p');
          var newSearch = params.toString() ? '?' + params.toString() : '';
          var newHash = window.location.hash;
          window.history.replaceState(null, null, window.location.pathname.replace(/\/$/, '') + redirectPath + newSearch + newHash);
        }
      })();
